name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Find Flutter Root & Build
      run: |
        # Check if pubspec.yaml is in root or subfolder
        if [ -f "pubspec.yaml" ]; then
          echo "Flutter project found in root"
          flutter pub get
          flutter build apk --release
        else
          echo "Searching for Flutter project in subdirectories..."
          SUBDIR=$(dirname $(find . -maxdepth 2 -name "pubspec.yaml" | head -n 1))
          echo "Found project in $SUBDIR"
          cd $SUBDIR
          flutter pub get
          flutter build apk --release
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: "**/build/app/outputs/flutter-apk/app-release.apk"
